name: verbaops

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    environment:
      POSTGRES_USER: verbaops
      POSTGRES_DB: verbaops
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verbaops -d verbaops"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:8.2.8-bookworm
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  tei-embedding:
    profiles: ["rag-models"]
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9@sha256:c26a226262ad4ff3330fb30b76653c1bb65da2fcf413b92284545a010e0a8a48
    command:
      [
        "--model-id",
        "intfloat/multilingual-e5-base",
        "--revision",
        "d128750597153bb5987e10b1c3493a34e5a4502a",
        "--port",
        "80",
      ]
    ports:
      - "${TEI_EMBEDDING_HOST_PORT:-8081}:80"
    volumes:
      - tei_embedding_cache:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 30

  tei-reranker:
    profiles: ["rag-models"]
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9@sha256:c26a226262ad4ff3330fb30b76653c1bb65da2fcf413b92284545a010e0a8a48
    command:
      [
        "--model-id",
        "cross-encoder/mmarco-mMiniLMv2-L12-H384-v1",
        "--revision",
        "1427fd652930e4ba29e8149678df786c240d8825",
        "--port",
        "80",
      ]
    ports:
      - "${TEI_RERANKER_HOST_PORT:-8082}:80"
    volumes:
      - tei_reranker_cache:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 30

  rag-llm-gateway:
    profiles: ["rag-models"]
    image: ghcr.io/berriai/litellm:v1.98.0@sha256:20b5044b619055374061a6d5b7b08754cad75aeabbf82ddf4f69cc0cf80ddaf4
    command: ["--config", "/app/config.rag.yaml", "--host", "0.0.0.0", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${RAG_LITELLM_MASTER_KEY:-local-rag-gateway-key}
    volumes:
      - ./infra/litellm/config.rag.yaml:/app/config.rag.yaml:ro
    ports:
      - "${RAG_LLM_GATEWAY_HOST_PORT:-14000}:4000"
    depends_on:
      tei-embedding:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 5s
      timeout: 5s
      retries: 30

  migrate:
    build:
      context: .
      target: runtime
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    secrets:
      - postgres_password

  api:
    build:
      context: .
      target: runtime
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')\""]
      interval: 5s
      timeout: 5s
      retries: 12
    secrets:
      - postgres_password

  worker:
    build:
      context: .
      target: runtime
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["celery", "-A", "verbaops.worker.celery_app:celery_app", "worker", "--loglevel=INFO"]
    secrets:
      - postgres_password

  commerce-postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: novacommerce
      POSTGRES_DB: novacommerce
      POSTGRES_PASSWORD_FILE: /run/secrets/commerce_postgres_password
    secrets:
      - commerce_postgres_password
    volumes:
      - commerce_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novacommerce -d novacommerce"]
      interval: 5s
      timeout: 5s
      retries: 12

  commerce-migrate:
    build:
      context: .
      target: runtime
    env_file:
      - path: .env
        required: false
    depends_on:
      commerce-postgres:
        condition: service_healthy
    command: ["alembic", "-c", "alembic-commerce.ini", "upgrade", "head"]
    secrets:
      - commerce_postgres_password

  commerce-api:
    build:
      context: .
      target: runtime
    env_file:
      - path: .env
        required: false
    depends_on:
      commerce-postgres:
        condition: service_healthy
      commerce-migrate:
        condition: service_completed_successfully
    command: ["uvicorn", "novacommerce.api.runtime:create_runtime_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8010:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')\""]
      interval: 5s
      timeout: 5s
      retries: 12
    secrets:
      - commerce_postgres_password

  commerce-seed:
    profiles: ["seed"]
    build:
      context: .
      target: seed
    env_file:
      - path: .env
        required: false
    depends_on:
      commerce-postgres:
        condition: service_healthy
      commerce-migrate:
        condition: service_completed_successfully
    secrets:
      - commerce_postgres_password

secrets:
  postgres_password:
    file: ./.secrets/postgres_password
  commerce_postgres_password:
    file: ./.secrets/commerce_postgres_password

volumes:
  postgres_data:
  commerce_postgres_data:
  tei_embedding_cache:
  tei_reranker_cache:
