repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: end-of-file-fixer
        exclude: ^evals/rag/v0\.2/dev-evidence/canonical/canonical-M0-P5-20261002T085922Z-80872fc6/p5-closeout\.json$
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: python -m ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format check
        entry: python -m ruff format --check
        language: system
        types: [python]
