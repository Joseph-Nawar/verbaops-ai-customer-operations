name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: false

      - name: Install project Python
        run: uv python install

      - name: Verify locked dependencies
        run: uv lock --check

      - name: Sync locked environment
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src tests scripts

      - name: Tests and coverage
        run: uv run pytest -m "not postgres and not commerce_acceptance and not commerce_client_contract and not llm_gateway_contract and not agent_acceptance" --cov=verbaops --cov=novacommerce --cov-report=term-missing

      - name: Pre-commit repository checks
        run: uv run pre-commit run --all-files

      - name: OpenAPI contract check
        run: make commerce-contract-check

  postgres-contract:
    name: postgres-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_USER: novacommerce_test
          POSTGRES_PASSWORD: novacommerce_test_password
          POSTGRES_DB: novacommerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novacommerce_test -d novacommerce_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NOVACOMMERCE_DATABASE__URL: postgresql+asyncpg://novacommerce_test:novacommerce_test_password@localhost:5432/novacommerce_test
      NOVACOMMERCE_TEST_DATABASE_URL: postgresql+asyncpg://novacommerce_test:novacommerce_test_password@localhost:5432/novacommerce_test
      NOVACOMMERCE_SERVICE_TOKEN: m2e-hosted-test-token-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: false

      - name: Install project Python
        run: uv python install

      - name: Sync locked environment
        run: uv sync --locked

      - name: Apply Commerce migrations
        run: uv run alembic -c alembic-commerce.ini upgrade head

      - name: Validate PostgreSQL marker taxonomy
        run: uv run pytest tests/test_postgres_classification.py -q

      - name: Run PostgreSQL contract suite
        run: uv run pytest -m "postgres and contract and not m3b"

  postgres-concurrency:
    name: postgres-concurrency
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_USER: novacommerce_test
          POSTGRES_PASSWORD: novacommerce_test_password
          POSTGRES_DB: novacommerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novacommerce_test -d novacommerce_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NOVACOMMERCE_DATABASE__URL: postgresql+asyncpg://novacommerce_test:novacommerce_test_password@localhost:5432/novacommerce_test
      NOVACOMMERCE_TEST_DATABASE_URL: postgresql+asyncpg://novacommerce_test:novacommerce_test_password@localhost:5432/novacommerce_test
      NOVACOMMERCE_SERVICE_TOKEN: m2e-hosted-test-token-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: false

      - name: Install project Python
        run: uv python install

      - name: Sync locked environment
        run: uv sync --locked

      - name: Apply Commerce migrations
        run: uv run alembic -c alembic-commerce.ini upgrade head

      - name: Validate PostgreSQL marker taxonomy
        run: uv run pytest tests/test_postgres_classification.py -q

      - name: Run PostgreSQL concurrency suite
        run: uv run pytest -m "postgres and concurrency and not m3b"

      - name: Repeat critical race suite 2
        run: uv run pytest -m "postgres and concurrency and critical_race and not m3b"

      - name: Repeat critical race suite 3
        run: uv run pytest -m "postgres and concurrency and critical_race and not m3b"

  postgres-m3b:
    name: postgres-m3b
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16-bookworm
        env:
          POSTGRES_USER: verbaops_test
          POSTGRES_PASSWORD: verbaops_test_password
          POSTGRES_DB: verbaops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verbaops_test -d verbaops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      VERBAOPS_DATABASE__URL: postgresql+asyncpg://verbaops_test:verbaops_test_password@localhost:5432/verbaops_test
      NOVACOMMERCE_TEST_DATABASE_URL: postgresql+asyncpg://verbaops_test:verbaops_test_password@localhost:5432/verbaops_test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: false

      - name: Install project Python
        run: uv python install

      - name: Sync locked environment
        run: uv sync --locked

      - name: Apply VerbaOps migrations
        run: uv run alembic upgrade head

      - name: Run M3B PostgreSQL persistence suite
        run: uv run pytest -m "postgres and m3b"

  postgres-m3d:
    name: postgres-m3d
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16-bookworm
        env:
          POSTGRES_USER: verbaops_test
          POSTGRES_PASSWORD: verbaops_test_password
          POSTGRES_DB: verbaops_test
        ports:
          - 5430:5432
        options: >-
          --health-cmd "pg_isready -U verbaops_test -d verbaops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      VERBAOPS_DATABASE__URL: postgresql+asyncpg://verbaops_test:verbaops_test_password@localhost:5430/verbaops_test
      NOVACOMMERCE_TEST_DATABASE_URL: postgresql+asyncpg://verbaops_test:verbaops_test_password@localhost:5430/verbaops_test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: false

      - name: Install project Python
        run: uv python install

      - name: Sync locked environment
        run: uv sync --locked

      - name: Apply VerbaOps migrations
        run: uv run alembic upgrade head

      - name: Run M3D PostgreSQL runtime suite
        run: uv run pytest -m "postgres and m3d"

  knowledge-contract:
    name: knowledge-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16-bookworm
        env:
          POSTGRES_USER: verbaops_test
          POSTGRES_PASSWORD: verbaops_test_password
          POSTGRES_DB: verbaops_test
        ports:
          - 5430:5432
        options: >-
          --health-cmd "pg_isready -U verbaops_test -d verbaops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:8.2.8-bookworm
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      VERBAOPS_DATABASE__URL: postgresql+asyncpg://verbaops_test:verbaops_test_password@localhost:5430/verbaops_test
      VERBAOPS_REDIS__URL: redis://localhost:6379/0
      VERBAOPS_ENVIRONMENT: test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: false

      - name: Install project Python
        run: uv python install

      - name: Verify locked dependencies
        run: uv lock --check

      - name: Sync locked environment
        run: uv sync --locked

      - name: Apply VerbaOps migrations through M5A
        run: uv run alembic upgrade 0004_knowledge_rag_v1

      - name: Validate committed corpus
        run: uv run python scripts/ingest_knowledge_corpus.py --check

      - name: Run provider-free knowledge contract
        run: >-
          uv run pytest tests/knowledge tests/postgres tests/api/test_knowledge_admin.py
          tests/worker/test_knowledge_tasks.py -m "not llm_gateway_contract" -q

  docker-build:
    name: docker-build
    needs: [quality, postgres-contract, postgres-concurrency]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build runtime image
        run: docker build --target runtime -t verbaops:ci .

  commerce-acceptance:
    name: commerce-acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: false

      - name: Install project Python
        run: uv python install

      - name: Verify locked dependencies
        run: uv lock --check

      - name: Sync locked environment
        run: uv sync --locked

      - name: Run permanent black-box acceptance
        run: make commerce-acceptance

  llm-gateway-contract:
    name: llm-gateway-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: false

      - name: Install project Python
        run: uv python install

      - name: Verify locked dependencies
        run: uv lock --check

      - name: Sync locked environment
        run: uv sync --locked

      - name: Run LLM gateway contract suite
        run: make llm-gateway-contract

  commerce-client-contract:
    name: commerce-client-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: false

      - name: Install project Python
        run: uv python install

      - name: Verify locked dependencies
        run: uv lock --check

      - name: Sync locked environment
        run: uv sync --locked

      - name: Run CommerceClient contract suite
        run: make commerce-client-contract

  agent-acceptance:
    name: agent-acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: false

      - name: Install project Python
        run: uv python install

      - name: Verify locked dependencies
        run: uv lock --check

      - name: Sync locked environment
        run: uv sync --locked

      - name: Run complete backend agent acceptance
        run: make agent-acceptance

  web-quality:
    name: web-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with:
          version: "11.23.0"

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/web

      - name: Lint web app
        run: pnpm lint
        working-directory: apps/web

      - name: Typecheck web app
        run: pnpm typecheck
        working-directory: apps/web

      - name: Test web app
        run: pnpm test
        working-directory: apps/web

      - name: Build web app
        run: pnpm build
        working-directory: apps/web

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web

      - name: Run browser smoke
        run: pnpm smoke
        working-directory: apps/web

  evaluation-contract:
    name: evaluation-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16-bookworm
        env:
          POSTGRES_USER: verbaops_test
          POSTGRES_PASSWORD: verbaops_test_password
          POSTGRES_DB: verbaops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verbaops_test -d verbaops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      VERBAOPS_DATABASE__URL: postgresql+asyncpg://verbaops_test:verbaops_test_password@localhost:5432/verbaops_test
      VERBAOPS_ENVIRONMENT: test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: false

      - name: Install project Python
        run: uv python install

      - name: Verify locked dependencies
        run: uv lock --check

      - name: Sync locked environment
        run: uv sync --locked

      - name: Apply VerbaOps migrations
        run: uv run alembic upgrade head

      - name: Audit golden corpus
        run: make eval-corpus-check

      - name: Run deterministic evaluation tests
        run: uv run pytest tests/evaluation -m "not evaluation_postgres" -q

      - name: Run evaluation PostgreSQL tests
        run: uv run pytest -m "evaluation_postgres" -q

      - name: Run deterministic evaluation adapter
        run: make eval-agent
