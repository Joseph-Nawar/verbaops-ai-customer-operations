[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "verbaops-ai"
version = "0.1.0"
description = "VerbaOps AI — Production-Grade Multilingual Agentic Customer Operations Platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.19,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.100,<1",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "redis>=8,<9",
    "sqlalchemy[asyncio]>=2.0.52,<2.1",
    "uvicorn[standard]>=0.52,<0.53",
]

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "httpx>=0.27,<1",
    "pre-commit>=4,<5",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.9,<1",
]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["src/verbaops"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]
asyncio_mode = "strict"

[tool.coverage.run]
branch = true
source = ["verbaops"]

[tool.coverage.report]
show_missing = true
precision = 2
fail_under = 80
